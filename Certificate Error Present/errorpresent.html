<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poprtal</title>
    <link rel="stylesheet" href="errorpresent.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="login.js" defer></script>

</head>
<body>
    <header>
        <div class="heading">
            <span id="welcome">Welcome back</span>
            <span id="details">Please enter your details to login</span>
        </div>

        <div class="form">
            <form id="loginForm">
                <label for="matricNumber">Matric number</label>
                <input type="text" placeholder="Enter matric number" id="matricNumber" name="matricNumber" autocomplete="username" required>
                <div class="password">
                    <label for="password">Password</label>
                    <a href="#" id="forgot"> <span>Forgot password?</span> </a>
                </div> 
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <div class="remember">
                     <input type="checkbox" id="remember">
                     <span>Remember me</span>
                </div>
                <button id="btn1" type="submit">Login</button>
                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>
        </div>
    </header>

         <div class="signin">
            <span>Don't have an account?</span>
            <a href="#" id="signIn">Sign in</a>
        </div>
</body>
</html>
